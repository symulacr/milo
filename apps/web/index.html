      Crawlable fallback. `mount()` calls `createRoot(...).render(...)`, which
      REPLACES this subtree rather than hydrating it, so no mismatch is possible:
      the first frame is this markup, and React takes over when the module runs.
      The landing moved from static HTML into `Landing.tsx`, which left `/` with
      an empty `<div id="root">` for crawlers and no-JS visitors. Keep it to the
      hero: it is a summary, not a second copy of the page.
    -->
    <div id="root">
      <main>
        <h1>Approve the exact files.</h1>
        <p>
          A private order between a studio and its client. Your browser checks
          the three final images before you approve, and you sign in with your
