<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milo — walkthrough</title>
    <meta name="description" content="Walkthrough of Milo, a privacy-first commissioning workspace on Midnight." />
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        --paper: #f6f3ee;
        --panel: #fffefb;
        --ink: #20201f;
        --muted: #5c5a57;
        --violet: #5434d7;
        --line: #ddd8d0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      main { width: 100%; max-width: 960px; }
      h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
      p.lede { color: var(--muted); margin: 0 0 20px; }
      .frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: var(--ink);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      footer { margin-top: 16px; font-size: 14px; color: var(--muted); }
      a { color: var(--violet); }
    </style>
  </head>
  <body>
    <main>
      <h1>Milo</h1>
      <p class="lede">One private commission, end to end.</p>
      <div class="frame">
        <iframe
          src="https://www.youtube-nocookie.com/embed/bF968ODpTos?rel=0"
          title="Milo walkthrough"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
          loading="eager"
        ></iframe>
      </div>
      <footer>
        <a href="https://github.com/symulacr/milo">Source</a> ·
        <a href="https://youtu.be/bF968ODpTos">Watch on YouTube</a> ·
        <a href="/">Open the live workspace</a>
      </footer>
    </main>
  </body>
</html>
