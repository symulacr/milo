<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-labelledby="t"><title id="t">Order lifecycle: reserve, accept, deliver, approve (sample)</title><rect width="960" height="220" rx="16" fill="var(--paper, #f6f3ee)"/><style>.lbl{font:600 16px system-ui,sans-serif;fill:var(--ink,#20201f)}.sub{font:400 13px system-ui,sans-serif;fill:var(--muted,#5c5a57)}.step{fill:var(--panel,#fffefb);stroke:var(--line,#ddd8d0);stroke-width:1.5}.ico{fill:none;stroke:var(--violet,#5434d7);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.path{stroke:var(--violet-accent,#8a74d5);stroke-width:2;stroke-dasharray:6 6;fill:none}@media (prefers-reduced-motion:reduce){.path{stroke-dasharray:none}}</style><g transform="translate(40 36)"><rect class="step" width="200" height="148" rx="16"/><circle cx="40" cy="40" r="22" fill="var(--violet-soft, #eee8ff)"/><path class="ico" d="M28,20 h28 v28 h-28 z" transform="translate(16 16)"/><text class="lbl" x="16" y="96">Reserve</text><text class="sub" x="16" y="120">Buyer places a sample hold</text><text class="sub" x="16" y="140" opacity="0.7">step 1 · sample</text></g><path class="path" d="M248 110 h24 m-6 -6 6 6 -6 6"/><g transform="translate(280 36)"><rect class="step" width="200" height="148" rx="16"/><circle cx="40" cy="40" r="22" fill="var(--violet-soft, #eee8ff)"/><path class="ico" d="M24,34 l8,8 16-16" transform="translate(16 16)"/><text class="lbl" x="16" y="96">Accept</text><text class="sub" x="16" y="120">Merchant accepts the scope</text><text class="sub" x="16" y="140" opacity="0.7">step 2 · sample</text></g><path class="path" d="M488 110 h24 m-6 -6 6 6 -6 6"/><g transform="translate(520 36)"><rect class="step" width="200" height="148" rx="16"/><circle cx="40" cy="40" r="22" fill="var(--violet-soft, #eee8ff)"/><path class="ico" d="M22,22 h20 v20 h-20 z M22,32 h20" transform="translate(16 16)"/><text class="lbl" x="16" y="96">Deliver</text><text class="sub" x="16" y="120">One fixed three-image pack</text><text class="sub" x="16" y="140" opacity="0.7">step 3 · sample</text></g><path class="path" d="M728 110 h24 m-6 -6 6 6 -6 6"/><g transform="translate(760 36)"><rect class="step" width="200" height="148" rx="16"/><circle cx="40" cy="40" r="22" fill="var(--violet-soft, #eee8ff)"/><path class="ico" d="M24,36 l8,8 16-20" transform="translate(16 16)"/><text class="lbl" x="16" y="96">Approve</text><text class="sub" x="16" y="120">Buyer decides · not payment</text><text class="sub" x="16" y="140" opacity="0.7">step 4 · sample</text></g><text x="40" y="200" font-family="system-ui,sans-serif" font-size="12" fill="var(--muted,#5c5a57)">Prototype sample · No live payments · Preprod test runs only · Approval is not payment</text></svg>
