version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # These cannot ride in a batch: the midnight cohort is asserted
        # against the compiled contract, and better-auth/convex own auth and
        # backend behaviour. A grouped bump took compact-runtime 0.16.0 ->
        # 0.20.0 and turned CI red (run 40496385118).
        exclude-patterns:
          - "@midnight-ntwrk/*"
          - "better-auth"
          - "convex"
          # A formatter bump needs a migration commit (2.6 formats Markdown and
          # adds `noComponentHookFactories`), which a bot PR cannot carry, so a
          # grouped bump lands red. Same mechanism as the cohort above.
          - "@biomejs/biome"
