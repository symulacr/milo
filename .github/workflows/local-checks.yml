name: Pinned local checks (not a protocol gate)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build reads deployment config, and Bun auto-loads `.env.local` on a dev
# machine but not here. Without this block CI builds a *different* policy than
# production ships (the narrowing is skipped when BETTER_AUTH_URL is unset), so a
# green CI run did not mean a green deploy. These are deliberately fake origins:
# they exist to make CI take the same branch, not to reach anything.
env:
  BETTER_AUTH_URL: https://ci.invalid.convex.site
  CONVEX_URL: https://ci.invalid.convex.cloud
  MIDNIGHT_NETWORK: preprod

jobs:
  local-checks:
    name: Compiler, local tests and build (Node 26.11.1 / Bun 1.4.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact integration Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'

      - name: Install pinned Bun, root dependencies and Compact toolchain
        run: |
          test "$(node --version)" = 'v26.11.1'
          sh scripts/setup.sh
          test "$(.tools/bun/node_modules/.bin/bun --version)" = '1.4.2'

      - name: Install isolated integration SDK cohort from lockfile
        run: npm ci --prefix packages/integration --ignore-scripts --no-audit --no-fund

      - name: Verify compiler and runtime cohort
        run: npm run contract:cohort

      # The compiler is the slowest step (~166 s cold). Its receipt names the
      # source hash, so the cache key is that hash: an unchanged contract
      # restores in ~2 s, any edit to order.compact misses.
      - name: Restore compiled contract artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/generated
          key: contract-${{ hashFiles('packages/contract/src/order.compact') }}-0.31.1

      # Generated modules and verifier keys are ignored by Git and needed by tests.
      - name: Compile full contract and verify all circuit artifacts
        timeout-minutes: 60
        run: npm run contract:compile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check canonical plan references
        run: npm run check:plan

      - name: Unit tests (web, domain, contract, backend and scripts)
        run: npm run test:unit

      # Synthetic/local SDK tests only: no native services or transaction commands.
      - name: Offline integration tests on exact Node runtime
        run: |
          test "$(node --version)" = 'v26.11.1'
          npm run test:integration

      - name: Build web app
        run: npm run build

      # A build that silently skipped CSP narrowing would pass every other gate.
      # This asserts the emitted policy actually took the configured branch, so
      # "the build succeeded" cannot hide a different artifact than production.
      - name: Assert the build used the configured deployment origins
        run: |
          test -f dist/vercel.json
          grep -q 'ci.invalid.convex.site' dist/vercel.json
          if grep -q 'https://\*\.convex\.cloud' dist/vercel.json; then
            echo 'CSP was left as shipped (wildcard origins): narrowing did not run.' >&2
            exit 1
          fi
          echo 'CSP narrowed to the configured origins.'

  # The native Midnight lane needs no container runtime: setup-native-services.py
  # extracts pinned binaries straight from the OCI registry over HTTPS and
  # verifies the manifest, platform, layer and binary sha256. Nothing here is
  # privileged. `milo` is a public repository, so standard runner minutes are
  # free and unlimited; the only real cost is wall time.
  #
  # Advisory on purpose. This job is a SEPARATE job, so it cannot affect the
  # `local-checks` job above, and `continue-on-error` means it cannot turn
  # `main` red either. Remove that line once the lane has two green hosted runs.
  native-network:
    name: Native Midnight smoke (no container runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact integration Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'

      - name: Install pinned Bun and root dependencies
        run: |
          test "$(node --version)" = 'v26.11.1'
          sh scripts/setup.sh

      # 416 MB of pinned binaries. Cached on the exact versions so a repeat run
      # skips both downloads; a version bump misses the key and re-provisions.
      - name: Restore native Midnight services
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/native-midnight
          key: native-midnight-node-1.0.0-indexer-4.3.3-prover-8.1.3

      - name: Run the native Midnight smoke
        run: npm run test:native-network
