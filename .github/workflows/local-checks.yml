name: Pinned local checks (not a protocol gate)

on:
  push:
    branches: [main]
  pull_request:
  # A $0 uptime check. GitHub's minimum interval is five minutes and a run can
  # slip under load, so this is a backstop, not an SLO instrument.
  schedule:
    # Off the top of the hour on purpose. `*/15` fires at :00, :15, :30 and :45,
    # and GitHub documents the start of every hour as a high-load window where
    # `schedule` events are delayed and, under load, dropped. This is the same
    # four ticks an hour at minutes that the docs recommend instead.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A scheduled run and a push run share `github.ref` (both are refs/heads/main),
# so one group meant every scheduled uptime check was cancelled by the next
# push. The event name is part of the key, so a schedule can only cancel a
# schedule. Measured: 9 pushes in the three hours after the cron landed and 0
# scheduled runs, while every push run reported the uptime job as "skipped".
concurrency:
  group: local-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The build reads deployment config, and Bun auto-loads `.env.local` on a dev
# machine but not here. Without this block CI builds a *different* policy than
# production ships (the narrowing is skipped when BETTER_AUTH_URL is unset), so a
# green CI run did not mean a green deploy. These are deliberately fake origins:
# they exist to make CI take the same branch, not to reach anything.
env:
  # The REAL origins, not placeholders: this job's `dist/` is what gets deployed
  # to Cloudflare below, and a build with `ci.invalid` would ship a CSP that
  # points at a host which does not exist.
  #
  # SITE_URL is deliberately NOT here. It is the one variable that changes test
  # behaviour: `auth.ts` builds `trustedOrigins` from it, and this suite sets
  # `CONVEX_SITE_URL ??= "privy.io"` (a bare host), so a job-wide SITE_URL makes
  # `betterAuth` validate that bare host and 12 authorization-matrix cases throw
  # `Invalid base URL: privy.io`. It is scoped to the build step instead.
  BETTER_AUTH_URL: https://tremendous-rooster-473.convex.site
  CONVEX_URL: https://tremendous-rooster-473.convex.cloud
  MIDNIGHT_NETWORK: preprod

jobs:
  local-checks:
    name: Compiler, local tests and build (Node 26.11.1 / Bun 1.4.2)
    # A `schedule` tick exists to probe the live site, not to re-run the suite.
    # Measured on the one real tick (run 40697404925): this job 49 s, the native
    # lane 280 s, the probe 4 s. Ninety-six ticks a day at that size is 7.5
    # runner-hours for four seconds of work, and a cron that heavy is the first
    # thing a busy scheduler drops. Push and PR runs are unchanged.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      # Set by the last step: did THIS run upload both hosts? `deploy-stamp`
      # only demands a matching stamp when it did.
      deployed: ${{ steps.deployed.outputs.both }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact integration Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'

      - name: Install pinned Bun, root dependencies and Compact toolchain
        run: |
          test "$(node --version)" = 'v26.11.1'
          sh scripts/setup.sh
          test "$(.tools/bun/node_modules/.bin/bun --version)" = '1.4.2'

      - name: Install isolated integration SDK cohort from lockfile
        run: npm ci --prefix packages/integration --ignore-scripts --no-audit --no-fund

      - name: Verify compiler and runtime cohort
        run: npm run contract:cohort

      # The compiler is the slowest step (~166 s cold). Its receipt names the
      # source hash, so the cache key is that hash: an unchanged contract
      # restores in ~2 s, any edit to order.compact misses.
      - name: Restore compiled contract artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/generated
          key: contract-${{ hashFiles('packages/contract/src/order.compact') }}-0.31.1

      # Generated modules and verifier keys are ignored by Git and needed by tests.
      - name: Compile full contract and verify all circuit artifacts
        timeout-minutes: 60
        run: npm run contract:compile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check canonical plan references
        run: npm run check:plan

      - name: Unit tests (web, domain, contract, backend and scripts)
        run: npm run test:unit

      # Synthetic/local SDK tests only: no native services or transaction commands.
      - name: Offline integration tests on exact Node runtime
        run: |
          test "$(node --version)" = 'v26.11.1'
          npm run test:integration

      # Each host must claim its OWN origin, and `scripts/build.ts` takes
      # `SITE_URL.split(",")[0]` as canonical, so two hosts that must not claim
      # each other's URL need two builds. Measured live 2026-10-31 before this
      # change: the mirror served canonical=https://milo.k2jodz91zi.workers.dev/
      # and Vercel served canonical=https://milo-nine-delta.vercel.app/, i.e. the
      # deployed pair was built separately by hand. CI now does the same thing.
      #
      # `build.ts` always writes `dist` and clears it first, so the Vercel
      # variant is built FIRST and moved aside. `dist` keeps the mirror variant
      # because `wrangler.toml` reads it as the relative `assets.directory`.
      - name: Build web app (Vercel origin)
        env:
          SITE_URL: https://milo-nine-delta.vercel.app
        run: |
          set -eu
          npm run build
          rm -rf dist-vercel
          mv dist dist-vercel

      - name: Build web app (mirror origin)
        env:
          SITE_URL: https://milo.k2jodz91zi.workers.dev
        run: npm run build

      # A build that silently skipped CSP narrowing would pass every other gate.
      # This asserts the emitted policy actually took the configured branch, so
      # "the build succeeded" cannot hide a different artifact than production.
      - name: Assert both builds used the configured deployment origins
        run: |
          set -eu
          for pair in \
            "dist https://milo.k2jodz91zi.workers.dev" \
            "dist-vercel https://milo-nine-delta.vercel.app"; do
            dir=${pair% *}
            origin=${pair##* }
            echo "== $dir -> $origin"
            test -f "$dir/vercel.json"
            grep -q 'tremendous-rooster-473.convex.site' "$dir/vercel.json"
            if grep -q 'https://\*\.convex\.cloud' "$dir/vercel.json"; then
              echo "CSP was left as shipped (wildcard origins) in $dir: narrowing did not run." >&2
              exit 1
            fi
            if grep -q 'ci\.invalid' "$dir/_headers" "$dir/vercel.json"; then
              echo "$dir carries placeholder origins; refusing to pass." >&2
              exit 1
            fi
            # Both artefacts carry the policy: Vercel reads vercel.json, the mirror
            # reads _headers. Check BOTH, and require the header to be PRESENT, so
            # a build that drops it entirely fails instead of passing on an absent
            # string.
            for artefact in "$dir/vercel.json" "$dir/_headers"; do
              if ! grep -q 'Content-Security-Policy' "$artefact"; then
                echo "no Content-Security-Policy in $artefact" >&2
                exit 1
              fi
              if grep -q 'Content-Security-Policy-Report-Only' "$artefact"; then
                echo "CSP is report-only in $artefact; the shipped policy enforces." >&2
                exit 1
              fi
            done
            # The whole reason there are two builds.
            if ! grep -q "rel=\"canonical\" href=\"$origin/\"" "$dir/index.html"; then
              echo "$dir does not claim $origin as canonical" >&2
              exit 1
            fi
          done
          echo 'Both builds narrowed CSP and claim their own origin.'

      # `secrets` is not available in a step-level `if:` (GitHub's context
      # availability table), so the presence check runs as a step and publishes an
      # output. Without this the deploy step reported `success` while deploying
      # nothing: the secret is unset, wrangler exits 1, and `continue-on-error`
      # turned that into a green tick. Measured on run 41217944987: step 16
      # `success`, wrangler `[ERROR] ... necessary to set a CLOUDFLARE_API_TOKEN`.
      - name: Check the Cloudflare deploy token is configured
        id: cf-token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo 'Cloudflare token is configured; the deploy step will run.'
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo '::warning title=Cloudflare deploy SKIPPED::CLOUDFLARE_API_TOKEN is not set. This run did NOT update the mirror. Add the repository secret to enable deploys.'
            echo 'CLOUDFLARE_API_TOKEN is not set: the deploy step will be SKIPPED, not passed.' >&2
          fi

      # No `continue-on-error`: with the token present, a real deploy failure must
      # fail the run. With it absent the step is SKIPPED (grey), never `success`.
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cf-token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d3a827e41b99a67dc1fc2169dfdacb30
        run: |
          set -eu
          npm install --no-save --no-audit --no-fund wrangler@4.152.0
          npx --no-install wrangler deploy \
            --tag "$GITHUB_SHA" \
            --message "$GITHUB_SHA $GITHUB_REF_NAME"

      # Same shape as the Cloudflare check above, and for the same reason:
      # `secrets` is not available in a step-level `if:`, so presence is published
      # as an output. Absent means SKIPPED (grey), never a green tick.
      - name: Check the Vercel deploy token is configured
        id: vercel-token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -eu
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo 'Vercel token is configured; the deploy step will run.'
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo '::warning title=Vercel deploy SKIPPED::VERCEL_TOKEN is not set. This run did NOT update Vercel. Add the repository secret to enable deploys.'
            echo 'VERCEL_TOKEN is not set: the deploy step will be SKIPPED, not passed.' >&2
          fi

      # Two traps this avoids, both measured 2026-10-31 while deploying by hand:
      #   1. `vercel deploy <dir>` with no link treats the DIRECTORY NAME as the
      #      project. It created `dist-vercel` (prj_cX6GrBggiMunMiFY7F63l65BWjm6)
      #      beside `milo` and shipped a production deployment nobody asked for.
      #   2. `vercel link` writes `.env.local` holding a fresh OIDC token INTO the
      #      upload directory. Vercel does not serve dotfiles (measured:
      #      /.env.local -> 404), but a credential has no business in an artefact.
      # So the link file is written directly, and the CLI runs with `--cwd` so it
      # reads that link rather than guessing from an argument path.
      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.vercel-token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -eu
          npm install --no-save --no-audit --no-fund vercel@64.5.0
          mkdir -p dist-vercel/.vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"milo"}\n' \
            "prj_DYkwgMSCJVEAxtps324I7XFmGNwA" \
            "team_QvocpUecoEGIETLHy21P9YZx" \
            > dist-vercel/.vercel/project.json
          npx --no-install vercel deploy \
            --cwd dist-vercel \
            --prod --yes --archive=tgz \
            --token "$VERCEL_TOKEN" --scope xkq

      # The one output `deploy-stamp` branches on. `always()` so it is still
      # written when a deploy step failed: the stamp job is then skipped by
      # `needs:` anyway, but a missing output would read as empty, not as "this
      # run deployed".
      - name: Record whether both hosts were deployed
        id: deployed
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Passed as env rather than interpolated into the script: the values are
        # step outputs, and a script that reads them from the environment cannot
        # have a value interpreted as code.
        env:
          CF_PRESENT: ${{ steps.cf-token.outputs.present }}
          VERCEL_PRESENT: ${{ steps.vercel-token.outputs.present }}
        run: |
          set -eu
          if [ "${CF_PRESENT:-}" = 'true' ] && [ "${VERCEL_PRESENT:-}" = 'true' ]; then
            echo "both=true" >> "$GITHUB_OUTPUT"
            echo 'This run uploaded both hosts.'
          else
            echo "both=false" >> "$GITHUB_OUTPUT"
            echo 'This run did NOT upload both hosts; the stamp check will report rather than fail.'
          fi

  # The deploy stamp is the only proof that what is live came from a commit, and
  # both hosts are checked independently because they can drift apart.
  #
  # Runs AFTER `local-checks`, because that job is what uploads both hosts. When
  # it did, the stamps must name THIS commit: a green run then means a live one,
  # which is the whole point of deploying from CI.
  #
  # When a token is missing that job skips its deploy steps and nothing was
  # uploaded. Demanding freshness then would paint every push red for something
  # that is not a fault, so the lag is reported in a notice and the step summary
  # instead. Host-to-host disagreement fails either way, because that is the drift
  # nobody else would see (the mirror once sat three days behind Vercel with no
  # red run).
  #
  # CUTOVER NOTE: this step probes Vercel as well as the mirror. When Vercel is
  # retired, `curl -fsS` on its URL returns 404, `set -euo pipefail` propagates
  # that through `wait`, and EVERY run goes red. The Vercel URL MUST be dropped
  # from DEPLOY_STAMP_HOSTS in the same change that retires Vercel.
  deploy-stamp:
    name: deploy.json names commit, branch, dirty and builtAt
    # Cutover is deleting one entry here, not editing a loop.
    needs: local-checks
    env:
      DEPLOY_STAMP_HOSTS: >-
        https://milo.k2jodz91zi.workers.dev
        https://milo-nine-delta.vercel.app
      # 'true' only when this run uploaded both hosts.
      DEPLOYED_BY_CI: ${{ needs.local-checks.outputs.deployed }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both hosts stamp a full commit, a branch, a dirty flag and a build time
        run: |
          set -euo pipefail
          dir=$(mktemp -d)

          # Word splitting is deliberate: the env var is a folded list of URLs.
          # shellcheck disable=SC2206
          hosts=($DEPLOY_STAMP_HOSTS)
          if [ "${#hosts[@]}" -eq 0 ]; then
            echo "DEPLOY_STAMP_HOSTS is empty; this job would compare nothing" >&2
            exit 1
          fi

          i=0
          pids=
          for host in "${hosts[@]}"; do
            i=$((i + 1))
            curl -fsS --max-time 20 "$host/deploy.json" -o "$dir/$i.json" &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done

          # An unmatched glob expands to the literal pattern, so a host that
          # returned nothing would be parsed as a file named "*.json" and fail
          # with a confusing message instead of "we fetched N of M". nullglob
          # plus an explicit count makes the miss say what actually happened.
          #
          # Key ORDER is not part of the contract. The previous check was one
          # ordered regex, so a stamp written `{"dirty":…,"commit":…}` was
          # rejected while being perfectly valid JSON. Each field is validated
          # on its own below, by name, via jq.
          shopt -s nullglob
          files=("$dir"/*.json)
          shopt -u nullglob
          if [ "${#files[@]}" -ne "${#hosts[@]}" ]; then
            echo "expected ${#hosts[@]} deploy stamps, found ${#files[@]}" >&2
            ls -l "$dir" >&2
            exit 1
          fi

          # `jq -e` exits 1 on a false filter and 5 on a runtime error, so a JSON
          # array or a non-JSON body lands in the same branch. The tool itself is
          # checked first so "jq is missing" can never look like "bad stamp".
          command -v jq > /dev/null || {
            echo "jq is not installed on this runner; the shape check cannot run" >&2
            exit 1
          }

          commits=()
          for f in "${files[@]}"; do
            # tostring keeps a wrong TYPE (null, number, object) a clean mismatch
            # rather than a jq error, so every rejection reads the same way and a
            # `null` commit can never satisfy the 40-hex test by being "false-ish".
            if ! jq -e '
                ((.commit  | tostring) | test("^[a-f0-9]{40}$"))
                and ((.builtAt | tostring) | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:"))
                and (.dirty | type == "boolean")
                and (.branch | type == "string")
                and (.branch | length > 0)
              ' "$f" > /dev/null 2>&1; then
              echo "$f is not a well-formed deploy stamp" >&2
              cat "$f" >&2
              exit 1
            fi
            commits+=("$(jq -r .commit "$f")")
          done

          # Shape alone is not enough: two individually valid stamps naming
          # DIFFERENT commits both pass, which is exactly how the mirror sat three
          # days stale against Vercel without a red run. The pair is what matters.
          distinct=$(printf '%s\n' "${commits[@]}" | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "hosts disagree on the deployed commit: ${commits[*]}" >&2
            exit 1
          fi

          live=${commits[0]}
          echo "all ${#commits[@]} hosts serve $live"

          # The run page is where a human looks first, so the served commit goes
          # there whether or not it matches this run.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Deployed commit"
              echo ""
              echo "| | commit |"
              echo "| --- | --- |"
              echo "| live on ${#commits[@]} hosts | \`$live\` |"
              echo "| this run | \`${GITHUB_SHA:-unknown}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$live" != "${GITHUB_SHA:-}" ]; then
            if [ "${DEPLOYED_BY_CI:-}" = "true" ]; then
              echo "::error::this run uploaded both hosts, so they must serve ${GITHUB_SHA:-unknown}, not $live" >&2
              exit 1
            fi
            echo "::notice::hosts serve $live, this run is ${GITHUB_SHA:-unknown}; this run did not upload (a deploy token is missing), so a lag is expected rather than a failure"
          fi

  # The native Midnight lane needs no container runtime: setup-native-services.py
  # extracts pinned binaries straight from the OCI registry over HTTPS and
  # verifies the manifest, platform, layer and binary sha256. Nothing here is
  # privileged. `milo` is a public repository, so standard runner minutes are
  # free and unlimited; the only real cost is wall time.
  #
  # Blocking since three consecutive green hosted runs (b777b3c, 1e4ccb8,
  # 97ce876). It is a SEPARATE job, so a failure here never hides the result of
  # the `local-checks` job above.
  native-network:
    name: Native Midnight smoke (no container runtime)
    # Same reason as `local-checks`: this job is the whole 280 s tick, and the
    # probe needs none of it. A schedule tick now runs only `uptime`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact integration Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'

      - name: Install pinned Bun and root dependencies
        run: |
          test "$(node --version)" = 'v26.11.1'
          sh scripts/setup.sh

      # 416 MB of pinned binaries. Cached on the exact versions so a repeat run
      # skips both downloads; a version bump misses the key and re-provisions.
      - name: Restore native Midnight services
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/native-midnight
          # The provisioned binary is ledger-8.1.0 (scripts/setup-native-services.py:41),
          # so an `8.1.3` key never matched the artifact it cached.
          key: native-midnight-node-1.0.0-indexer-4.3.3-prover-8.1.0

      # `packages/contract/generated` is gitignored, so a fresh clone has none of
      # it and the driver's first stage (validateArtifacts) fails before it does
      # any work. The main job compiles it; this job must too.
      - name: Compile the contract
        timeout-minutes: 60
        run: npm run contract:compile

      # The driver also validates the integration cohort, which the main job
      # installs and verifies. Without these two steps the lane cannot start.
      - name: Install isolated integration SDK cohort from lockfile
        run: npm ci --prefix packages/integration --ignore-scripts --no-audit --no-fund

      - name: Verify compiler and runtime cohort
        run: npm run contract:cohort

      - name: Run the native Midnight smoke
        run: npm run test:native-network

      # The only place all 14 proof circuits are exercised without touching
      # Preprod. `local-circuit-sweep.mjs` builds a fresh staged 7+7 instance per
      # scenario on a local `undeployed` chain — 10 scenarios covering every
      # proof circuit — so a failure names a circuit in minutes instead of hours.
      #
      # Three steps, not one, because of a measured budget: `main()` arms a
      # whole-run watchdog of `MILO_LOCAL_TIMEOUT_MS` (sweep line 305-309), and
      # `native-node-smoke.ts` forces that to 1_800_000 ms for this lane, which
      # is also `PROBE_TIMEOUT_MS`. Measured on run 41257755418: the single-step
      # form reached `call-expire-dispute-expireDispute` (scenario 9 of 10,
      # circuit 14 of 14 in flight) and then emitted `timeout` at exactly
      # 1800.00 s, having already proved the other nine. Two minutes short, and
      # every failure cost a 30-minute round trip to learn nothing new.
      #
      # `MILO_SWEEP_ONLY` already accepts a comma list (sweep line 520-527), so
      # sharding needs no code change. Each step is ~5-15 min, well inside the
      # watchdog, and a red run now names the scenario group.
      #
      # `--circuit-sweep` refuses to run alongside the other lanes by design
      # (scripts/native-node-smoke.ts asserts it needs only `--transactions`) and
      # `--transactions` itself requires `--with-services`.
      - name: Every proof circuit succeeds (happy path, cancel, decline)
        run: >-
          sh scripts/with-bun.sh scripts/test-native-network.ts
          --circuit-sweep --transactions --with-services
        env:
          MILO_SWEEP_ONLY: happy-path,cancel,decline

      - name: Every proof circuit succeeds (disputes and bootstrap expiry)
        run: >-
          sh scripts/with-bun.sh scripts/test-native-network.ts
          --circuit-sweep --transactions --with-services
        env:
          MILO_SWEEP_ONLY: dispute-buyer,dispute-merchant,expire-bootstrap

      - name: Every proof circuit succeeds (remaining expiry and escalation)
        run: >-
          sh scripts/with-bun.sh scripts/test-native-network.ts
          --circuit-sweep --transactions --with-services
        env:
          MILO_SWEEP_ONLY: expire-reserved,expire-undelivered,escalate-unreviewed,expire-dispute

      # The assertion only reports an exit code; the driver's own `failed` event
      # and the service logs live in this directory, which is gitignored. Without
      # this upload a red run is undiagnosable from the log alone.
      # Kept on success too. The sweep writes its only per-circuit record to
      # `transactions.jsonl` (native-node-smoke.ts redirects the driver's stdout
      # there), so with `if: failure()` a PASSING run leaves no evidence of which
      # circuits it actually proved — the green tick is then the only claim, and
      # "exit 0" has to be trusted rather than checked. The artefact measured 83 KB
      # on the sharded sweep, and retention is 3 days, so keeping it always is
      # nearly free and makes coverage auditable after the fact.
      - name: Upload the native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-midnight-evidence
          # Only the diagnostics: `res/` is 44 MB of node config presets and the
          # `.sqlite` files are throwaway ledger state, together 99% of the dir.
          path: |
            .hoplite/artifacts/native-node/**/transactions.jsonl
            .hoplite/artifacts/native-node/**/transactions.stderr.log
            .hoplite/artifacts/native-node/**/node.stderr.log
            .hoplite/artifacts/native-node/**/indexer.stdout.log
            .hoplite/artifacts/native-node/**/prover.stdout.log
          retention-days: 3
          if-no-files-found: warn

  # Nothing watched the live site before this job. The static host and the Convex
  # backend can be down independently, so both are checked.
  #
  # `continue-on-error` is deliberately NOT set: a failed run is the alert. It
  # notifies the owner through GitHub's own settings, the only free channel on
  # this plan (Vercel log drains and Convex periodic backups are both Pro-only).
  uptime:
    name: Live site is up
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The page answers 200 and is the app, not a parked page
        run: |
          set -eu
          url=https://milo.k2jodz91zi.workers.dev/
          code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 20 "$url")
          echo "$url -> $code"
          test "$code" = 200
          grep -qi 'milo' /tmp/page.html

      # The workspace cannot start without this, and the build emits it, so a 200
      # here proves the artifact on the CDN is the one we shipped.
      - name: The public config is served and names a Convex deployment
        run: |
          set -eu
          body=$(curl -sS --max-time 20 https://milo.k2jodz91zi.workers.dev/api/public-config)
          echo "$body"
          echo "$body" | grep -q '"convexUrl":"https://'
          echo "$body" | grep -q '"betterAuthUrl":"https://'

      # convex.site is a different host and can be down alone. `/csp-report` is
      # the one route that exists there (convex/http.ts:493) and answers 204.
      - name: The Convex site origin answers
        run: |
          set -eu
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST -H 'content-type: application/csp-report' \
            -d '{"csp-report":{"violated-directive":"uptime-probe"}}' \
            https://tremendous-rooster-473.convex.site/csp-report)
          echo "convex.site /csp-report -> $code"
          test "$code" = 204

      # The Stripe webhook has a blind spot that nothing else covers: when its
      # env is missing the handler refuses every delivery with 503 and writes no
      # inbox row, so no digest entry is ever created and the operator sees
      # silence rather than a fault. This probe is the only signal.
      #
      # It is unauthenticated BY DESIGN: a bogus body must be refused at the
      # signature gate with 400, which proves the route is registered AND the
      # secret/account env is present without needing any Stripe key. Measured
      # live 2026-10-28: 400 healthy, 503 when STRIPE_ACCOUNT_ID is unset, 404
      # when the route is gone.
      - name: The Stripe webhook refuses a bogus delivery instead of failing closed
        run: |
          set -eu
          code=$(curl -sS -o /tmp/webhook.json -w '%{http_code}' --max-time 20 \
            -X POST -H 'content-type: application/json' -d '{}' \
            https://tremendous-rooster-473.convex.site/webhooks/stripe)
          echo "convex.site /webhooks/stripe -> $code"
          cat /tmp/webhook.json; echo
          case "$code" in
            400) echo 'signature gate answered: route registered, webhook env present.' ;;
            503) echo 'STRIPE_WEBHOOK_SECRET or STRIPE_ACCOUNT_ID is unset or malformed on the Convex deployment; every Stripe delivery is being refused and no inbox row is written.' >&2; exit 1 ;;
            404) echo 'the /webhooks/stripe route is not registered on the Convex deployment (convex/http.ts).' >&2; exit 1 ;;
            *)   echo "unexpected status $code from /webhooks/stripe; expected 400 (healthy), 503 (env unset) or 404 (route gone)." >&2; exit 1 ;;
          esac
