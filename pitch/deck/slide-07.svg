<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#fafaf9"/>
  <rect x="0" y="0" width="1280" height="10" fill="#c2410c"/>
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="18" fill="#c2410c">PROVEN vs TRUSTED</text>
  <text x="80" y="155" font-family="Georgia, serif" font-size="36" fill="#1c1917">Dual-state, published honestly</text>
  <rect x="80" y="210" width="540" height="300" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="110" y="260" font-family="system-ui, sans-serif" font-size="18" fill="#047857">WHAT IS PROVEN (execution)</text>
  <text x="110" y="315" font-family="system-ui, sans-serif" font-size="20" fill="#064e3b">Preprod: 2 contracts, 14 keys each</text>
  <text x="110" y="360" font-family="system-ui, sans-serif" font-size="20" fill="#064e3b">Local lane: 14 / 14 exercised</text>
  <text x="110" y="405" font-family="system-ui, sans-serif" font-size="20" fill="#064e3b">Preprod: reserve + accept proved</text>
  <text x="110" y="440" font-family="system-ui, sans-serif" font-size="20" fill="#064e3b">State tx + block re-queried</text>
  <text x="110" y="482" font-family="system-ui, sans-serif" font-size="18" fill="#065f46">Source: RECEIPTS.md + Blockfrost query</text>
  <rect x="660" y="210" width="540" height="300" rx="12" fill="#fef2f2" stroke="#f87171"/>
  <text x="690" y="260" font-family="system-ui, sans-serif" font-size="18" fill="#b91c1c">WHAT IS NOT YET (acceptance)</text>
  <text x="690" y="315" font-family="system-ui, sans-serif" font-size="20" fill="#7f1d1d">Provider acceptance 0 / 6</text>
  <text x="690" y="360" font-family="system-ui, sans-serif" font-size="20" fill="#7f1d1d">Operation acceptance 0 / 14</text>
  <text x="690" y="405" font-family="system-ui, sans-serif" font-size="20" fill="#7f1d1d">Stripe capture / PaymentIntents: not yet</text>
  <text x="690" y="450" font-family="system-ui, sans-serif" font-size="18" fill="#991b1b">No live-payment claim in this deck</text>
  <text x="80" y="580" font-family="system-ui, sans-serif" font-size="20" fill="#44403c">We publish both. Execution ≠ acceptance.</text>
  <text x="80" y="660" font-family="system-ui, sans-serif" font-size="14" fill="#78716c">Slide 7 / 10</text>
</svg>
