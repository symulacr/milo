<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#fafaf9"/>
  <rect x="0" y="0" width="1280" height="10" fill="#c2410c"/>
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="18" fill="#c2410c">WHY MIDNIGHT</text>
  <text x="80" y="155" font-family="Georgia, serif" font-size="36" fill="#1c1917">Public integrity without public terms</text>
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="20" fill="#292524">· Compact circuits decide who may move the order</text>
  <text x="80" y="280" font-family="system-ui, sans-serif" font-size="20" fill="#292524">· Phase and hashed commitments are re-queryable</text>
  <text x="80" y="330" font-family="system-ui, sans-serif" font-size="20" fill="#292524">· Price, brief, and files do not appear as ledger plaintext</text>
  <text x="80" y="380" font-family="system-ui, sans-serif" font-size="20" fill="#292524">· Both parties and an outsider can inspect the same public state</text>
  <rect x="80" y="440" width="1120" height="150" rx="12" fill="#1c1917"/>
  <text x="110" y="490" font-family="system-ui, sans-serif" font-size="18" fill="#fdba74">14 named order circuits in contract state (RECEIPTS.md)</text>
  <text x="110" y="535" font-family="system-ui, sans-serif" font-size="16" fill="#e7e5e4">reserve · accept · submitDelivery · approve · cancelReserved · decline</text>
  <text x="110" y="570" font-family="system-ui, sans-serif" font-size="16" fill="#e7e5e4">disputeBuyer · disputeMerchant · resolve · expire* · escalateUnreviewed</text>
  <text x="80" y="660" font-family="system-ui, sans-serif" font-size="14" fill="#78716c">Slide 6 / 10</text>
</svg>
